<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#B83A00">
  <title>Martha's Cuisines Invoice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:wght@400;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <a class="skip-link" href="#builder">Skip to the invoice form</a>
  <nav class="topnav" aria-label="Main">
    <a href="/" class="brand-logo" aria-label="Martha's Cuisines home">
      <img src="/assets/logo.jpeg" alt="Martha's Cuisines" class="nav-logo">
    </a>
    <button type="button" id="menu-toggle" class="menu-toggle" aria-expanded="false" aria-controls="nav-menu" aria-label="Menu">
      <span class="menu-icon"></span>
    </button>
    <div id="nav-menu-backdrop" class="nav-menu-backdrop"></div>
    <div id="nav-menu" class="nav-menu">
      <a href="/" class="current" aria-current="page">New Invoice</a>
      <a href="/invoices.html">All Invoices</a>
      <button type="button" id="preview-toggle" class="nav-link">Preview Invoice</button>
      <button type="button" id="logout" class="link">Log out</button>
    </div>
  </nav>
  <main class="app" data-view="edit">
    <form id="builder" class="builder" autocomplete="off" novalidate>
      <h1 id="form-title">New invoice</h1>
      <p id="locked-note" class="locked-note" hidden></p>

      <fieldset>
        <legend>Client and event</legend>
        <div class="field">
          <label for="clientName">Client name (required)</label>
          <input id="clientName" name="clientName" autocomplete="off" maxlength="200" aria-describedby="err-clientName" enterkeyhint="next">
          <p class="field-error" id="err-clientName"></p>
        </div>
        <div class="field">
          <label for="clientPhone">Client phone</label>
          <input id="clientPhone" name="clientPhone" type="tel" inputmode="tel" maxlength="40" enterkeyhint="next">
        </div>
        <div class="field-pair">
          <div class="field">
            <label for="eventDate">Event date</label>
            <input id="eventDate" name="eventDate" type="date">
          </div>
          <div class="field">
            <label for="venue">Venue</label>
            <input id="venue" name="venue" maxlength="200" enterkeyhint="next">
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Items</legend>
        <ul id="lines" class="items" aria-label="Items on this invoice"></ul>
        <p class="field-error" id="err-items"></p>
        <div id="draft" class="draft"></div>
        <p class="field-error" id="err-draft"></p>
        <div class="draft-actions">
          <button type="button" id="add-line" class="secondary">Add item</button>
          <button type="button" id="cancel-edit" class="link-btn" hidden>Cancel</button>
        </div>
      </fieldset>

      <fieldset>
        <legend>Discount and deposit</legend>
        <div class="discount-row">
          <div class="field">
            <label for="discountValue">Discount</label>
            <input id="discountValue" name="discountValue" inputmode="decimal" aria-describedby="err-discountValue" enterkeyhint="next">
          </div>
          <div class="field">
            <label for="discountType">Type</label>
            <select id="discountType" name="discountType">
              <option value="amount">GHS</option>
              <option value="percent">%</option>
            </select>
          </div>
        </div>
        <p class="field-error" id="err-discountValue"></p>
        <div class="field">
          <label for="deposit">Deposit paid (GHS)</label>
          <input id="deposit" name="deposit" inputmode="decimal" aria-describedby="err-deposit" enterkeyhint="next">
          <p class="field-error" id="err-deposit"></p>
        </div>

        <dl class="summary" aria-label="Totals so far">
          <div><dt>Subtotal</dt><dd id="sum-subtotal"></dd></div>
          <div id="sum-discount-row"><dt>Discount</dt><dd id="sum-discount"></dd></div>
          <div><dt>Total</dt><dd id="sum-total"></dd></div>
          <div id="sum-deposit-row"><dt>Deposit paid</dt><dd id="sum-deposit"></dd></div>
          <div class="grand"><dt>Balance due</dt><dd id="sum-balance"></dd></div>
        </dl>
      </fieldset>

      <fieldset id="dishes">
        <legend>Menu (optional)</legend>
        <!-- filled by app.js from src/menu.js -->
      </fieldset>

      <fieldset>
        <legend>Dates and notes</legend>
        <div class="field">
          <label for="invoiceDate">Invoice date</label>
          <input id="invoiceDate" name="invoiceDate" type="date" enterkeyhint="next">
        </div>
        <div class="field">
          <label for="notes">Notes for the client</label>
          <textarea id="notes" name="notes" rows="3" maxlength="1000"></textarea>
        </div>
      </fieldset>
    </form>

    <section class="preview" aria-label="Invoice preview">
      <h1 class="page-sticky-title" id="preview-page-title" hidden>Preview invoice</h1>
      <article id="invoice" class="invoice"></article>
    </section>
  </main>

  <div class="bar">
    <p id="notices" class="notices" role="alert"></p>
    <div class="bar-row">
      <div class="bar-total">
        <span class="bar-label">Balance due</span>
        <strong id="bar-balance"></strong>
      </div>
      <div class="bar-actions">
        <button type="button" id="save">Save invoice</button>
        <button type="button" id="print" class="secondary" title="Opens the print window. Choose Save as PDF to download a copy.">Print or save as PDF</button>
        <button type="button" id="whatsapp" class="secondary is-off" aria-disabled="true" title="Save the invoice first">Send on WhatsApp</button>
      </div>
    </div>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
