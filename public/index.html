<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Martha's Cuisines Invoice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:wght@400;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <nav class="topnav">
    <a href="/" class="current" aria-current="page">New invoice</a>
    <a href="/invoices.html">All invoices</a>
    <button type="button" id="logout" class="link">Log out</button>
  </nav>
  <main class="app">
    <form id="builder" class="builder" autocomplete="off">
      <h1 id="form-title">New invoice</h1>

      <fieldset>
        <legend>Client and event</legend>
        <label>Client name (required) <input name="clientName" required autocomplete="off"></label>
        <label>Client phone <input name="clientPhone" inputmode="tel"></label>
        <label>Event date <input name="eventDate" type="date"></label>
        <label>Venue <input name="venue"></label>
      </fieldset>

      <fieldset>
        <legend>Items</legend>
        <div id="lines"></div>
        <button type="button" id="add-line" class="secondary">Add item</button>
      </fieldset>

      <fieldset>
        <legend>Discount and deposit</legend>
        <div class="discount-row">
          <label>Discount <input name="discountValue" inputmode="decimal"></label>
          <label>Type
            <select name="discountType">
              <option value="amount">GHS</option>
              <option value="percent">%</option>
            </select>
          </label>
        </div>
        <label>Deposit paid (GHS) <input name="deposit" inputmode="decimal"></label>
      </fieldset>

      <fieldset id="dishes">
        <legend>Menu (optional)</legend>
        <p class="hint">Tick the dishes to list on the invoice. This does not change the price.</p>
        <!-- filled by app.js from src/menu.js -->
      </fieldset>

      <fieldset>
        <legend>Dates and notes</legend>
        <label>Invoice date <input name="invoiceDate" type="date"></label>
        <label>Notes for the client <textarea name="notes" rows="3" maxlength="1000"></textarea></label>
      </fieldset>
    </form>

    <section class="preview" aria-label="Invoice preview">
      <article id="invoice" class="invoice"></article>
    </section>
  </main>

  <div class="bar">
    <p id="notices" class="notices" role="status"></p>
    <div class="bar-row">
      <div>
        <span class="bar-label">Balance due</span>
        <strong id="bar-balance"></strong>
      </div>
      <div class="bar-actions">
        <button type="button" id="save">Save invoice</button>
        <button type="button" id="print" class="secondary" title="Opens the print window. Choose Save as PDF to download a copy.">Print or save as PDF</button>
        <button type="button" id="whatsapp" class="secondary is-off" aria-disabled="true" title="Save the invoice first">Send on WhatsApp</button>
      </div>
    </div>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
