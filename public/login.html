<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in | Martha's Cuisines</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:wght@400;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="plain">
  <main class="login">
    <img class="inv-logo" src="/assets/logo.jpeg" alt="Martha's Cuisines">
    <h1 class="login-title">Invoices</h1>
    <form id="login-form">
      <label>Password <input type="password" name="password" autocomplete="current-password" required autofocus></label>
      <p id="error" class="notices" role="alert"></p>
      <button type="submit">Log in</button>
    </form>
  </main>
  <script type="module" src="/js/login.js"></script>
</body>
</html>
