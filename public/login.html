<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#B83A00">
  <title>Log in | Martha's Cuisines</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:wght@400;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="plain">
  <main class="login">
    <img class="inv-logo" src="/assets/logo.jpeg" alt="Martha's Cuisines">
    <h1 class="login-title">Invoices</h1>
    <form id="login-form" novalidate>
      <div class="field">
        <label for="pin">PIN</label>
        <input id="pin" type="password" name="pin" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off" aria-describedby="err-pin" autofocus>
        <p id="err-pin" class="field-error" role="alert"></p>
      </div>
      <button type="submit">Log in</button>
    </form>
  </main>
  <script type="module" src="/js/login.js"></script>
</body>
</html>
